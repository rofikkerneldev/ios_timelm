name: publish-release

on:
  # Every finished kernel build publishes itself: no hardcoded run id, no
  # manual step. workflow_dispatch stays for a re-publish of an older build.
  workflow_run:
    workflows: ["xnu (LG V60 timelm)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "xnu workflow run id to publish (empty = latest successful)"
        default: ""

permissions:
  contents: write
  actions: read
  issues: write

env:
  PD_AUTH: 64e8a6ac-6e73-4dab-8bc0-d5e4dabade82

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve xnu run
        id: xnu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="${{ inputs.run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" \
              -w "xnu (LG V60 timelm)" --status success --limit 1 \
              --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$run_id" ]; then
            echo "no successful xnu run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "publishing xnu run $run_id"
          gh run view "$run_id" -R "$GITHUB_REPOSITORY" \
            --json headSha,conclusion,displayTitle \
            -q '"commit \(.headSha[0:8]) \(.conclusion): \(.displayTitle)"'

      - name: Download XNU artifact
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          run-id: ${{ steps.xnu.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kernel-files

      - name: Inspect files
        run: |
          ls -la kernel-files
          (cd kernel-files && tar -czvf ../xnu-kernel-timelm.tar.gz *)

      - name: Upload to Pixeldrain
        run: |
          set -euo pipefail
          : > pixeldrain-links.txt
          for f in kernel-files/* xnu-kernel-timelm.tar.gz; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              echo "Uploading $base to Pixeldrain..."
              res=$(curl -s -u ":$PD_AUTH" -T "$f" "https://pixeldrain.com/api/file/$base")
              echo "Response: $res"
              # Keep the ids in a file so they can be read back from the
              # release assets (the CI log needs a token).
              id=$(printf '%s' "$res" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
              sha=$(printf '%s' "$res" | sed -n 's/.*"hash_sha256":"\([^"]*\)".*/\1/p')
              if [ -n "$id" ]; then
                printf '%s\t%s\tsha256:%s\thttps://pixeldrain.com/api/file/%s\n' \
                  "$base" "$id" "$sha" "$id" >> pixeldrain-links.txt
              fi
            fi
          done
          cat pixeldrain-links.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh cannot guess the repository here: the workflow does not
          # check the tree out.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag="kernel-latest"
          notes="XNU kernel for LG V60 ThinQ 5G (timelm, SM8250), xnu run ${{ steps.xnu.outputs.run_id }}."
          log=/tmp/publish-release.log
          {
            echo "== release state =="
            rel=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            printf '%s\n' "$rel" | head -c 300; echo
            rid=$(printf '%s' "$rel" | jq -r '.id // empty')
            if [ -n "$rid" ]; then
              echo "== release $rid exists: update =="
              curl -sS -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$rid" \
                -d "$(jq -n --arg b "$notes" '{body:$b}')" | jq -r '.html_url // .message'
            else
              echo "== no release yet: create =="
              curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
                -d "$(jq -n --arg t "$tag" --arg n "XNU kernel for timelm (LG V60)" \
                      --arg b "$notes" --arg c "$GITHUB_SHA" \
                      '{tag_name:$t,name:$n,body:$b,target_commitish:$c}')" \
                | jq -r '.html_url // .message'
            fi
            echo "== upload assets =="
            gh release upload "$tag" kernel-files/* xnu-kernel-timelm.tar.gz pixeldrain-links.txt --clobber
            echo "== release url =="
            gh release view "$tag" --json url,tagName -q '.url'
          } > "$log" 2>&1
          rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::release step failed (rc=$rc); log posted as an issue"
            jq -Rs --arg sha "$GITHUB_SHA" \
              '{title:"publish-release failed", body:(. + "\n\ncommit: " + $sha)}' < "$log" \
              | curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" --data-binary @- \
              | jq -r '.html_url // .message'
          fi
          exit "$rc"
